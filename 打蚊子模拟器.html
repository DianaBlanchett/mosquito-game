<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>打蚊子模拟器</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #e8f5e9;
        }

        #game {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #mosquito {
            position: absolute;
            font-size: 50px;
            cursor: pointer;
            user-select: none;
        }

        #score {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 28px;
            font-family: Arial;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div id="game">
    <div id="score">分数：0</div>
    <div id="mosquito">🦟</div>
</div>

<script>

let score = 0;

const mosquito = document.getElementById("mosquito");

function moveMosquito() {

    const maxX = window.innerWidth - 60;
    const maxY = window.innerHeight - 60;

    const x = Math.random() * maxX;
    const y = Math.random() * maxY;

    mosquito.style.left = x + "px";
    mosquito.style.top = y + "px";
}

mosquito.addEventListener("click", function() {

    score++;

    document.getElementById("score").textContent =
        "分数：" + score;

    moveMosquito();
});

moveMosquito();

</script>

</body>
</html>
